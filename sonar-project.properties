sonar.projectKey=gmr-community-api
sonar.projectName=gmr-community-api
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**

# pytest coverage from tests/conftest.py auto-cov; if not present, sonar still reads it
sonar.python.coverage.reportPaths=coverage.xml

# Files excluded from analysis (untested infra glue)
sonar.exclusions=\
  src/infra/postgres/**,\
  src/infra/memory/**

# Coverage exclusions: routers, infra, app bootstrap, generated migrations
sonar.coverage.exclusions=\
  src/api/app.py,\
  src/api/routers/**,\
  src/api/dependencies.py,\
  src/infra/**,\
  src/assistant/proxy_client.py,\
  src/services/llm_service.py

# Ignore python:S930 on FastAPI Depends — Sonar's type stubs don't know about
# the `scope="function"` kwarg (real FastAPI arg added in 2024). Confirmed by
# runtime behavior and FastAPI docs.
sonar.issue.ignore.multicriteria=s930deps,pylintall,complexsvc,complexllm
sonar.issue.ignore.multicriteria.s930deps.ruleKey=python:S930
sonar.issue.ignore.multicriteria.s930deps.resourceKey=src/api/**/*.py
# pylint runs as part of the gate already — don't double-count its findings in Sonar
sonar.issue.ignore.multicriteria.pylintall.ruleKey=external_pylint:*
sonar.issue.ignore.multicriteria.pylintall.resourceKey=**/*.py
# Cognitive complexity ignored on SSE streaming turn() — inherently sequential
sonar.issue.ignore.multicriteria.complexsvc.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexsvc.resourceKey=src/assistant/service.py
# Cognitive complexity ignored on chat() — tool-use loop with fallback branches
sonar.issue.ignore.multicriteria.complexllm.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.complexllm.resourceKey=src/services/llm_service.py
