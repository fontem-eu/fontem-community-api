apiVersion: apps/v1
kind: Deployment
metadata:
  name: fontem-community-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-community-api
  template:
    metadata:
      labels:
        app: fontem-community-api
        kube-monkey/enabled: enabled
        kube-monkey/identifier: fontem-community-api
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: contribute.void42.internal/fontem/fontem-community-api:{{ .Values.version }}
          ports:
            - containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fontem-jwt-secret
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fontem-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: CLAUDE_PROXY_URL
              value: {{ .Values.claudeProxyUrl | quote }}
            # The Mistral assistant + the legacy MCP tool layer hit
            # fontem-api via this URL. Pre-rename it was
            # `gmr-api.gmr.svc.cluster.local`, which is now NXDOMAIN —
            # silently breaking every search/get-company/contracts tool.
            # Default `http://fontem-api` resolves namespace-locally
            # (testing/staging/dast/prod each have their own
            # fontem-api Service); per-env values can override.
            - name: GMR_API_INTERNAL
              value: {{ .Values.gmrApiInternal | default "http://fontem-api" | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.llmProvider | default "mistral" | quote }}
            # The shared llama.cpp server (Qwen3-4B), one instance for
            # every environment — see gitops/infra/llm-service.yaml.
            # When set, a user with no API key of their own gets this
            # rather than an "assistant unavailable" message, which is
            # the default path for almost everyone. Unset it and the
            # assistant reverts to requiring a key.
            - name: LOCAL_LLM_URL
              value: {{ .Values.localLlmUrl | default "http://llama-server.llm-service.svc.cluster.local:8080" | quote }}
            - name: LOCAL_LLM_MODEL
              value: {{ .Values.localLlmModel | default "qwen3-4b" | quote }}
            # Which assistant executor runs the turn. Unset, or anything
            # other than "langgraph", keeps the native tool loop — the
            # tuned one. See src/assistant/langgraph_client.py for what
            # the LangGraph path does and does not yet carry.
            - name: ASSISTANT_ENGINE
              value: {{ .Values.assistantEngine | default "" | quote }}
            - name: MISTRAL_MODEL
              value: {{ .Values.mistralModel | default "mistral-small-latest" | quote }}
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mistralSecretName | default "mistral-api-key" }}
                  key: api-key
                  optional: true
            - name: MINIO_ENDPOINT
              value: {{ .Values.minioEndpoint | default "minio.gmr.svc.cluster.local:9000" | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minioBucket | default "fontem-uploads" | quote }}
            # Public-facing MinIO host used for *signing* presigned GET
            # URLs. nginx in fontem-web proxies /${MINIO_BUCKET}/<key>
            # to the in-cluster MinIO with the Host header intact, so
            # this is the user-visible front of the site (e.g.
            # fontem.staging.void42.internal). Falls back to
            # MINIO_ENDPOINT for dev where the API and browser share
            # the same MinIO.
            - name: MINIO_PUBLIC_ENDPOINT
              value: {{ .Values.minioPublicEndpoint | default "" | quote }}
            - name: MINIO_PUBLIC_SECURE
              value: {{ .Values.minioPublicSecure | default "true" | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            # ── Transactional mail (Brevo) ──────────────────────────
            # BREVO_API_KEY is Vault-backed only in prod; non-prod runs
            # with MAIL_SUPPRESS=true and no key (optional secretKeyRef
            # → unset env → MailService logs instead of sending). The
            # FROM / REPLY-TO identity + suppress flag + the public
            # base URL for verification/reset links come from values.
            - name: BREVO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: brevo-credentials
                  key: BREVO_API_KEY
                  optional: true
            - name: MAIL_SUPPRESS
              value: {{ .Values.mailSuppress | default "true" | quote }}
            - name: MAIL_FROM
              value: {{ .Values.mailFrom | default "noreply@fontem.eu" | quote }}
            - name: MAIL_FROM_NAME
              value: {{ .Values.mailFromName | default "Fontem" | quote }}
            - name: MAIL_REPLY_TO
              value: {{ .Values.mailReplyTo | default "support@fontem.eu" | quote }}
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | default "https://fontem.eu" | quote }}
            # ClamAV daemon for the upload pipeline's final gate. The
            # file_security service degrades to "scan skipped with a
            # warning log" if CLAMAV_HOST is empty — so omitting this
            # in dev / unit tests is fine, but every deployed env must
            # set it. Staging/testing/dast point at the shared
            # daemon; prod has its own isolated instance.
            - name: CLAMAV_HOST
              value: {{ .Values.clamavHost | default "" | quote }}
            - name: CLAMAV_PORT
              value: {{ .Values.clamavPort | default "3310" | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
          # The precomputed catalogue block, written by the daily CronJob and
          # the PostSync hook in llm-service. optional:true so a cluster
          # without the refresh job still starts — the assistant falls back to
          # fetching the catalogue live, which is slower but correct.
          volumeMounts:
            - name: prefill
              mountPath: /etc/fontem/prefill
              readOnly: true
      volumes:
        - name: prefill
          configMap:
            name: llm-prefill
            optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
