apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmr-community-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmr-community-api
  template:
    metadata:
      labels:
        app: gmr-community-api
        kube-monkey/enabled: enabled
        kube-monkey/identifier: gmr-community-api
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: contribute.void42.internal/golden/gmr-community-api:{{ .Values.version }}
          ports:
            - containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gmr-jwt-secret
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmr-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: CLAUDE_PROXY_URL
              value: {{ .Values.claudeProxyUrl | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
