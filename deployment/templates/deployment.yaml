apiVersion: apps/v1
kind: Deployment
metadata:
  name: fontem-community-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-community-api
  template:
    metadata:
      labels:
        app: fontem-community-api
        kube-monkey/enabled: enabled
        kube-monkey/identifier: fontem-community-api
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: contribute.void42.internal/fontem/fontem-community-api:{{ .Values.version }}
          ports:
            - containerPort: 8001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fontem-jwt-secret
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fontem-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: CLAUDE_PROXY_URL
              value: {{ .Values.claudeProxyUrl | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.llmProvider | default "mistral" | quote }}
            - name: MISTRAL_MODEL
              value: {{ .Values.mistralModel | default "mistral-small-latest" | quote }}
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mistralSecretName | default "mistral-api-key" }}
                  key: api-key
                  optional: true
            - name: MINIO_ENDPOINT
              value: {{ .Values.minioEndpoint | default "minio.gmr.svc.cluster.local:9000" | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minioBucket | default "fontem-uploads" | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
