[alembic]
script_location = migrations
# No sqlalchemy.url here on purpose. env.py reads DATABASE_URL, the same
# variable the app itself uses, so a migration can never be pointed at a
# different database than the service it belongs to. It used to hardcode
# postgres:postgres@localhost:5432/gmr_app, which is nobody's database.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
# qualname is REQUIRED by logging.config.fileConfig for non-root loggers.
# Without it env.py raised KeyError: 'qualname' before it finished
# importing, so alembic was not runnable at all in this repo.
qualname = sqlalchemy.engine
level = WARN
handlers =
[logger_alembic]
qualname = alembic
level = INFO
handlers =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
