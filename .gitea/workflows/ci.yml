name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: pip install --no-cache-dir -r requirements.txt pytest pylint pytest-cov
      - name: Test with coverage
        run: python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  # Pre-build supply-chain gate; see gmr-ci/actions/osv-scan for the
  # shared threshold/scanner-version definition.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.fontem-ci/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.fontem-ci/actions/secret-scan

  analyze:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}
      - name: Install deps and generate coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir -r requirements.txt pytest pytest-cov
          python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml || true
      - uses: ./.fontem-ci/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Build → sign → attest SBOM → deploy. SBOM generation moved into
  # this job so the same file is both uploaded to DT and used as
  # the attestation predicate.
  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    # ci-python runner bundles python3 + pip + node + docker CLI + cosign
    # (cosign baked in by ci-images PR #15).
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: void42/fontem-ci
          path: .fontem-ci
          token: ${{ secrets.GMR_CI_READ_TOKEN }}

      - id: sbom
        name: Generate + upload SBOM
        uses: ./.fontem-ci/actions/sbom-generate
        with:
          language: python
          project-name: fontem-community-api
          project-version: ${{ github.sha }}
          dtrack-key: ${{ secrets.DTRACK_API_KEY }}

      - id: image
        name: Build, push, sign, attest
        uses: ./.fontem-ci/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-community-api
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          sbom-path: ${{ steps.sbom.outputs.sbom-path }}

      - uses: ./.fontem-ci/actions/gitops-bump
        with:
          service: fontem-community-api
          tag: ${{ steps.image.outputs.tag }}
          env: testing
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
