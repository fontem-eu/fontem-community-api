name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt pytest pylint
      - name: Test
        run: python3 -m pytest tests/unit/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: apt-get update -qq && apt-get install -y -qq docker.io > /dev/null && docker version
      - name: Login
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build
        run: docker build -t gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-community-api:v$(git rev-parse --short HEAD) .
      - name: Push
        run: docker push gitea-http.dev-tools.svc.cluster.local:3000/golden/gmr-community-api:v$(git rev-parse --short HEAD)
      - name: Deploy to dev
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          sed -i "s/version: .*/version: \"$TAG\"/" deployment/values-dev.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add deployment/values-dev.yaml
          git diff --cached --quiet || git commit -m "ci: deploy $TAG to dev [skip ci]"
          git push
