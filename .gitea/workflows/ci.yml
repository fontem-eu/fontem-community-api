name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt pytest pylint
      - name: Test
        run: python3 -m pytest tests/unit/ -q
      - name: Lint
        run: python3 -m pylint src tests --output-format=parseable --reports=no 2>&1 | tail -1 || true

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, push, and deploy to dev
        env:
          REGISTRY: gitea-http.dev-tools.svc.cluster.local:3000
          IMAGE: golden/gmr-community-api
          REG_USER: ${{ secrets.REGISTRY_USER }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq docker.io > /dev/null
          TAG="v$(git rev-parse --short HEAD)"
          echo "Building $REGISTRY/$IMAGE:$TAG"
          echo "$REG_PASS" | docker login "$REGISTRY" -u "$REG_USER" --password-stdin
          docker build -t "$REGISTRY/$IMAGE:$TAG" .
          docker push "$REGISTRY/$IMAGE:$TAG"
          echo "Updating values-dev.yaml to $TAG"
          sed -i "s/version: .*/version: \"$TAG\"/" deployment/values-dev.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add deployment/values-dev.yaml
          git diff --cached --quiet || git commit -m "ci: deploy $TAG to dev [skip ci]"
          git push
